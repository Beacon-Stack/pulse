# ============================================================================
# Pulse — control plane for the Beacon apps
# https://beaconstack.io/pulse
#
#   1. Set the host path and the external URL below.
#   2. docker compose up -d
#   3. Open http://<this-host>:9696
#
# Pulse is optional. Pilot, Prism and Haul each run on their own; connect
# them to Pulse to share indexers, quality profiles and download clients
# in one place. Point each app at this Pulse with its *_PULSE_URL and
# *_PULSE_API_KEY settings (see each app's compose file). Examples that
# connect the whole stack: https://beaconstack.io
# ============================================================================

services:
  pulse:
    image: ghcr.io/beacon-stack/pulse:latest
    container_name: pulse
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      TZ: UTC                       # your timezone, e.g. America/New_York

      # The address Pilot and Prism use to reach Pulse. Pulse puts it in
      # the indexer URLs it hands them, so it must work from inside their
      # containers: use this host's IP or DNS name, not localhost.
      PULSE_SERVER_EXTERNAL_URL: http://192.168.1.10:9696
    volumes:
      # Pulse's database and settings. Keep it on a local disk.
      - /path/to/config/pulse:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9696/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
