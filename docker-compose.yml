# Pulse — control plane for the Beacon apps
# https://beaconstack.io/pulse
#
#   1. Set the host path and the external URL below.
#   2. docker compose up -d
#   3. Open http://<this-host>:9696
#
# Pulse is optional. Pilot, Prism and Haul each run on their own; connect
# them to Pulse to share indexers, quality profiles and download clients
# in one place. Point each app at this Pulse with its *_PULSE_URL and
# *_PULSE_API_KEY settings (see each app's compose file). Examples that
# connect the whole stack: https://beaconstack.io

services:
  pulse:
    image: ghcr.io/beacon-stack/pulse:latest
    container_name: pulse
    restart: unless-stopped
    # Hardening: no Linux capabilities, no privilege gain, and nothing
    # writable except the mounted folders and a small /tmp.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    ports:
      - "9696:9696"
    environment:
      TZ: UTC                       # your timezone, e.g. America/New_York

      # The address Pilot and Prism use to reach Pulse. Pulse puts it in
      # the indexer URLs it hands them, so it must work from inside their
      # containers: use this host's IP or DNS name, not localhost.
      PULSE_SERVER_EXTERNAL_URL: http://192.168.1.10:9696

      # Optional: a VPN panel for a Gluetun container (status, Rotate IP,
      # Change region) and FlareSolverr for Cloudflare-protected indexers.
      # Full setup, including Gluetun's side: https://beaconstack.io/install#vpn
      # PULSE_DASHBOARD_GLUETUN_URL: http://vpn:8000
      # PULSE_DASHBOARD_GLUETUN_API_KEY: ${GLUETUN_API_KEY}
      # PULSE_DASHBOARD_GLUETUN_SERVERS_DIR: /gluetun-servers
      # PULSE_FLARESOLVERR_URL: http://vpn:8191
      # Send Pulse's indexer searches and .torrent downloads through the
      # VPN as well (Gluetun with HTTPPROXY=on). If the VPN is down they
      # fail rather than use this machine's own IP.
      # PULSE_SCRAPER_PROXY_URL: http://vpn:8888
    volumes:
      # Pulse's database and settings. Keep it on a local disk.
      - /path/to/config/pulse:/config
      # With the VPN panel: Gluetun's server list, for Change region.
      # - /path/to/gluetun/servers:/gluetun-servers:ro
    healthcheck:
      test: ["CMD", "/app/pulse", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
